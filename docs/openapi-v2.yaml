        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Connection"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. Connection outages are connection_not_ready (retryable) with the engine cause in error.internal_code."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/ConnectionError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "requestBody":
        "required": false
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "auth_method":
                  "type": "string"
                  "enum":
                    - "qr"
                    - "pairing"
                  "default": "qr"
                "phone":
                  "type": "string"
                  "description": "Required for pairing; international number."
                  "pattern": "^\\+?[1-9][0-9]{6,14}$"
                "provider":
                  "type": "object"
                  "description": "Provider routes only: corrected settings; omitted keys keep their stored value."
                  "properties":
                    "configuration":
                      "type": "object"
                      "additionalProperties": true
      "parameters":
        -
          "name": "connection"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/connections/{connection}/messages":
    "post":
      "summary": "Send through a connection"
      "operationId": "post_api_v2_connections_connection_messages"
      "x-required-scope": "messages:send"
      "description": "Managed number: identical to POST /api/v2/sessions/{session}/messages on the connection's session (202, text/image/document/voice, same idempotency and media rules). Provider route: text only, dispatched synchronously through the routing policy and its fallback: 201 once a provider accepted, 202 while still in flight; a failed delivery returns the error object together with data. An Idempotency-Key replay returns the original message before any readiness check."
      "responses":
        "202":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/ConnectionMessage"
                "required":
                  - "data"
        "201":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/ConnectionMessage"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. Connection outages are connection_not_ready (retryable) with the engine cause in error.internal_code."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/ConnectionError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "to":
                  "type": "string"
                  "pattern": "^\\+?[1-9][0-9]{7,14}$"
                "type":
                  "type": "string"
                  "enum":
                    - "text"
                    - "image"
                    - "document"
                    - "voice"
                  "default": "text"
                "text":
                  "type": "string"
                  "maxLength": 10000
                "media_id":
                  "type": "string"
                  "format": "uuid"
                  "description": "Managed numbers only; required for media types."
                "expires_at":
                  "type": "string"
                  "format": "date-time"
              "required":
                - "to"
      "parameters":
        -
          "name": "connection"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 160
          "description": "Installation-scoped key retained for retries. Same payload returns the original message; changed payload returns 409."
