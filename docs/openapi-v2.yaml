"openapi": "3.0.3"
"info":
  "title": "wag-hub Lean Engine API"
  "version": "2.0.0"
  "description": "Installation-scoped backend API. wag-hub owns session state and transport; the consumer owns UX and user permissions. The private runner and startup-grant endpoint are intentionally excluded from this public contract."
"servers":
  -
    "url": "https://wag-hub.example.com"
"security":
  -
    "installationToken": []
"paths":
  "/api/v2/integration":
    "get":
      "summary": "Discover grants, capacity and capabilities"
      "operationId": "get_api_v2_integration"
      "x-required-scope": "integration:read"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Integration"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
    "patch":
      "summary": "Change account operating limit"
      "operationId": "patch_api_v2_integration"
      "x-required-scope": "capacity:manage"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Integration"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "configured_limit":
                  "type": "integer"
                  "minimum": 0
              "required":
                - "configured_limit"
  "/api/v2/integration/webhook":
    "put":
      "summary": "Register the installation webhook"
      "operationId": "put_api_v2_integration_webhook"
      "x-required-scope": "webhooks:manage"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "type": "object"
                    "properties":
                      "enabled":
                        "type": "boolean"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "Secret is stored encrypted and never returned. HTTPS is required for public destinations; private host exceptions are operator-configured."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "url":
                  "type": "string"
                  "format": "uri"
                  "maxLength": 2048
                "secret":
                  "type": "string"
                  "minLength": 32
                  "maxLength": 256
              "required":
                - "url"
                - "secret"
  "/api/v2/sessions":
    "get":
      "summary": "List the authoritative account pool"
      "operationId": "get_api_v2_sessions"
      "x-required-scope": "sessions:read"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/Session"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
    "post":
      "summary": "Create an account and optionally start authentication"
      "operationId": "post_api_v2_sessions"
      "x-required-scope": "sessions:manage"
      "responses":
        "201":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Lifecycle"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "Use {start:true} for one-step QR connection. No phone number is needed for QR. All non-deleted sessions reserve capacity, including stopped sessions."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "name":
                  "type": "string"
                  "minLength": 1
                  "maxLength": 120
                "start":
                  "type": "boolean"
                  "default": false
                "external_reference":
                  "type": "string"
                  "minLength": 1
                  "maxLength": 160
                "auth_method":
                  "type": "string"
                  "enum":
                    - "qr"
                    - "pairing"
                  "default": "qr"
                "phone":
                  "type": "string"
                  "description": "Required only for pairing; international number."
                  "pattern": "^\\+?[1-9][0-9]{6,14}$"
      "parameters":
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 160
          "description": "Installation-scoped key retained for retries. Same payload returns the original record; changed payload returns 409."
  "/api/v2/sessions/{session}":
    "get":
      "summary": "Read a refreshed session observation"
      "operationId": "get_api_v2_sessions_session"
      "x-required-scope": "sessions:read"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Session"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "parameters":
        -
          "name": "session"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
    "patch":
      "summary": "Rename an account"
      "operationId": "patch_api_v2_sessions_session"
      "x-required-scope": "sessions:manage"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Session"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "name":
                  "type": "string"
                  "minLength": 1
                  "maxLength": 120
              "required":
                - "name"
      "parameters":
        -
          "name": "session"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
    "delete":
      "summary": "Remove an account after confirmed local teardown"
      "operationId": "delete_api_v2_sessions_session"
      "x-required-scope": "sessions:manage"
      "responses":
        "202":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Lifecycle"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "Deletion releases capacity only on operation completion. The hub keeps a minimal tombstone and message history."
      "parameters":
        -
          "name": "session"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/sessions/{session}/start":
    "post":
      "summary": "Start or resume an account"
      "operationId": "post_api_v2_sessions_session_start"
      "x-required-scope": "sessions:manage"
      "responses":
        "202":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Lifecycle"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "Uses saved authentication when valid; otherwise presents a QR challenge."
      "parameters":
        -
          "name": "session"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/sessions/{session}/stop":
    "post":
      "summary": "Pause an account"
      "operationId": "post_api_v2_sessions_session_stop"
      "x-required-scope": "sessions:manage"
      "responses":
        "202":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Lifecycle"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "Blocks new sends immediately and preserves authentication. STOPPED is observed only after local teardown completes."
      "parameters":
        -
          "name": "session"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/sessions/{session}/logout":
    "post":
      "summary": "Unlink WhatsApp"
      "operationId": "post_api_v2_sessions_session_logout"
      "x-required-scope": "sessions:manage"
      "responses":
        "202":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Lifecycle"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "Clears local authentication. Remote unlink confirmation is exposed separately in operation.result.remote_logout_confirmed."
      "parameters":
        -
          "name": "session"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/sessions/{session}/auth/qr":
    "get":
      "summary": "Read the current QR or pairing challenge"
      "operationId": "get_api_v2_sessions_session_auth_qr"
      "x-required-scope": "sessions:manage"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Challenge"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "Cache-Control: no-store. Re-fetch during connection; null values mean the challenge is pending, expired, or no longer required."
      "parameters":
        -
          "name": "session"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/sessions/{session}/auth/pairing-code":
    "post":
      "summary": "Request pairing instead of QR"
      "operationId": "post_api_v2_sessions_session_auth_pairing_code"
      "x-required-scope": "sessions:manage"
      "responses":
        "202":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Lifecycle"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "Poll the challenge endpoint after the asynchronous operation. Never derive the final authenticated identity from the supplied phone."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "phone":
                  "type": "string"
                  "pattern": "^\\+?[1-9][0-9]{6,14}$"
              "required":
                - "phone"
      "parameters":
        -
          "name": "session"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/operations/{operation}":
    "get":
      "summary": "Observe lifecycle operation completion"
      "operationId": "get_api_v2_operations_operation"
      "x-required-scope": "sessions:read"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Operation"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "parameters":
        -
          "name": "operation"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/sessions/{session}/messages":
    "post":
      "summary": "Persist an idempotent text or media send"
      "operationId": "post_api_v2_sessions_session_messages"
      "x-required-scope": "messages:send"
      "responses":
        "202":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Message"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "For text, media_id is prohibited. For other types, media_id is required and must belong to this installation and match the type. The session must be fresh and WORKING. outcome_unknown is queried/reconciled, never automatically resent."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "oneOf":
                -
                  "type": "object"
                  "properties":
                    "to":
                      "type": "string"
                      "pattern": "^\\+?[1-9][0-9]{7,14}$"
                    "type":
                      "type": "string"
                      "enum":
                        - "text"
                      "default": "text"
                    "text":
                      "type": "string"
                      "minLength": 1
                      "maxLength": 10000
                    "expires_at":
                      "type": "string"
                      "format": "date-time"
                  "required":
                    - "to"
                    - "text"
                -
                  "type": "object"
                  "properties":
                    "to":
                      "type": "string"
                      "pattern": "^\\+?[1-9][0-9]{7,14}$"
                    "type":
                      "type": "string"
                      "enum":
                        - "image"
                        - "document"
                        - "voice"
                    "text":
                      "type": "string"
                      "maxLength": 10000
                    "media_id":
                      "type": "string"
                      "format": "uuid"
                    "expires_at":
                      "type": "string"
                      "format": "date-time"
                  "required":
                    - "to"
                    - "type"
                    - "media_id"
      "parameters":
        -
          "name": "session"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 160
          "description": "Installation-scoped key retained for retries. Same payload returns the original record; changed payload returns 409."
  "/api/v2/messages/{message}":
    "get":
      "summary": "Read transport and recipient acknowledgement separately"
      "operationId": "get_api_v2_messages_message"
      "x-required-scope": "messages:read"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Message"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "parameters":
        -
          "name": "message"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/media":
    "post":
      "summary": "Upload private media"
      "operationId": "post_api_v2_media"
      "x-required-scope": "media:write"
      "responses":
        "201":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Media"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "Maximum 16 MiB. JPEG/PNG images; documents; voice converted to OGG/Opus (maximum five minutes). Media expires after seven days."
      "requestBody":
        "required": true
        "content":
          "multipart/form-data":
            "schema":
              "type": "object"
              "properties":
                "type":
                  "type": "string"
                  "enum":
                    - "image"
                    - "document"
                    - "voice"
                "file":
                  "type": "string"
                  "format": "binary"
              "required":
                - "type"
                - "file"
  "/api/v2/media/{media}":
    "get":
      "summary": "Download installation-owned private media"
      "operationId": "get_api_v2_media_media"
      "x-required-scope": "media:read"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/octet-stream":
              "schema":
                "type": "string"
                "format": "binary"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "parameters":
        -
          "name": "media"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/events":
    "get":
      "summary": "Replay retained events"
      "operationId": "get_api_v2_events"
      "x-required-scope": "messages:read"
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/EventPage"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. See ENGINE_V2.md for recovery guidance."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/EngineError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "description": "Seven-day retention. HTTP 410 event_cursor_expired means refresh authoritative sessions and restart replay from 0 with deduplication."
      "parameters":
        -
          "in": "query"
          "name": "after"
          "schema":
            "type": "integer"
            "minimum": 0
          "description": "Use next_cursor from the previous page; 0 starts at the oldest retained event."
        -
          "in": "query"
          "name": "limit"
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 100
  "/api/v2/connections":
    "get":
      "summary": "List WhatsApp connections"
      "operationId": "get_api_v2_connections"
      "x-required-scope": "sessions:read"
      "description": "Every v2 session of the installation (including sessions mapped by engine:migrate-legacy) is listed as a managed_number connection; the default routing policy is listed as a provider_route. Never returns QR or pairing codes."
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/Connection"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. Connection outages are connection_not_ready (retryable) with the engine cause in error.internal_code."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/ConnectionError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
    "post":
      "summary": "Create a managed number or provider route connection"
      "operationId": "post_api_v2_connections"
      "x-required-scope": "sessions:manage"
      "description": "managed_number creates and starts a v2 session through the same path as POST /api/v2/sessions (start:true, same Idempotency-Key): it reserves capacity (capacity_exceeded) and appears in /api/v2/sessions. provider_route stores tenant-owned provider settings (public hosts only) behind a dedicated routing policy. Same key and body returns the original connection; same key with a changed body returns 409 idempotency_conflict."
      "responses":
        "201":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Connection"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. Connection outages are connection_not_ready (retryable) with the engine cause in error.internal_code."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/ConnectionError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ConnectionCreate"
      "parameters":
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 160
          "description": "Installation-scoped key retained for retries. For a managed number it is also the session creation key."
  "/api/v2/connections/{connection}":
    "get":
      "summary": "Connection status, QR or pairing code"
      "operationId": "get_api_v2_connections_connection"
      "x-required-scope": "sessions:read"
      "description": "For a managed number the session is refreshed like GET /api/v2/sessions/{id}; qr / pairing_code are present only while the session waits for authentication, and only for credentials with sessions:manage (as for GET /api/v2/sessions/{id}/auth/qr). Responses are Cache-Control: no-store. Another installation's connection is 404 connection_not_found."
      "responses":
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Connection"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. Connection outages are connection_not_ready (retryable) with the engine cause in error.internal_code."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/ConnectionError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "parameters":
        -
          "name": "connection"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/connections/{connection}/connect":
    "post":
      "summary": "Pair or reconnect"
      "operationId": "post_api_v2_connections_connection_connect"
      "x-required-scope": "sessions:manage"
      "description": "Managed number: issues a v2 session start command (202, pending operation is reported with retryable:true), or creates a new session when the previous one was removed (capacity applies). Provider route: reconnects a tenant-owned session provider (200)."
      "responses":
        "202":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Connection"
                "required":
                  - "data"
        "200":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "data":
                    "$ref": "#/components/schemas/Connection"
                "required":
                  - "data"
        "default":
          "description": "Authentication, authorization, validation, capacity, lifecycle, rate-limit or availability error. Connection outages are connection_not_ready (retryable) with the engine cause in error.internal_code."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "$ref": "#/components/schemas/ConnectionError"
                  -
                    "$ref": "#/components/schemas/ValidationError"
      "requestBody":
        "required": false
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "auth_method":
                  "type": "string"
                  "enum":
                    - "qr"
                    - "pairing"
                  "default": "qr"
                "phone":
                  "type": "string"
                  "description": "Required for pairing; international number."
                  "pattern": "^\\+?[1-9][0-9]{6,14}$"
                "provider":
                  "type": "object"
                  "description": "Provider routes only: corrected settings; omitted keys keep their stored value."
                  "properties":
                    "configuration":
                      "type": "object"
                      "additionalProperties": true
      "parameters":
        -
          "name": "connection"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v2/connections/{connection}/retry":
