"components":
  "securitySchemes":
    "installationToken":
      "type": "http"
      "scheme": "bearer"
      "description": "Server-side installation token issued through the hub integration pack. Required capability is listed in x-required-scope."
  "schemas":
    "Operation":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "action":
          "type": "string"
          "enum":
            - "start"
            - "stop"
            - "logout"
            - "delete"
            - "pairing-code"
        "status":
          "type": "string"
          "enum":
            - "pending"
            - "processing"
            - "completed"
            - "failed"
            - "superseded"
        "last_error":
          "type": "string"
          "nullable": true
        "result":
          "type": "object"
          "properties":
            "remote_logout_confirmed":
              "type": "boolean"
              "nullable": true
          "nullable": true
        "completed_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
      "required":
        - "id"
        - "action"
        - "status"
    "Session":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
        "external_reference":
          "type": "string"
          "nullable": true
        "status":
          "type": "string"
          "enum":
            - "STOPPED"
            - "STARTING"
            - "SCAN_QR_CODE"
            - "WORKING"
            - "FAILED"
        "desired_state":
          "type": "string"
          "enum":
            - "RUNNING"
            - "STOPPED"
        "phone_number":
          "type": "string"
          "nullable": true
        "auth_method":
          "type": "string"
          "enum":
            - "qr"
            - "pairing"
          "nullable": true
        "revision":
          "type": "integer"
          "minimum": 0
        "observed_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
        "stale":
          "type": "boolean"
        "engine_available":
          "type": "boolean"
        "pending_operation":
          "allOf":
            -
              "$ref": "#/components/schemas/Operation"
          "nullable": true
        "last_error":
          "type": "string"
          "nullable": true
        "deleted":
          "type": "boolean"
      "required":
        - "id"
        - "name"
        - "status"
        - "desired_state"
        - "revision"
        - "stale"
        - "engine_available"
    "Integration":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
        "scopes":
          "type": "array"
          "items":
            "type": "string"
        "capabilities":
          "type": "object"
          "properties":
            "api_version":
              "type": "integer"
              "enum":
                - 2
            "auth_methods":
              "type": "array"
              "items":
                "type": "string"
                "enum":
                  - "qr"
                  - "pairing"
            "message_types":
              "type": "array"
              "items":
                "type": "string"
                "enum":
                  - "text"
                  - "image"
                  - "document"
                  - "voice"
            "media_max_bytes":
              "type": "integer"
              "minimum": 0
            "image_mime_types":
              "type": "array"
              "items":
                "type": "string"
            "voice_mime_types":
              "type": "array"
              "items":
                "type": "string"
            "events":
              "type": "array"
              "items":
                "type": "string"
        "capacity":
          "type": "object"
          "properties":
            "used":
              "type": "integer"
              "minimum": 0
            "configured_limit":
              "type": "integer"
              "minimum": 0
            "maximum_allowed":
              "type": "integer"
              "minimum": 0
        "webhook":
          "type": "object"
          "properties":
            "enabled":
              "type": "boolean"
            "url":
              "type": "string"
              "nullable": true
            "last_success_at":
              "type": "string"
              "format": "date-time"
              "nullable": true
            "last_error":
              "type": "string"
              "nullable": true
      "required":
        - "id"
        - "scopes"
        - "capabilities"
        - "capacity"
        - "webhook"
    "Lifecycle":
      "type": "object"
      "properties":
        "session":
          "$ref": "#/components/schemas/Session"
        "operation":
          "allOf":
            -
              "$ref": "#/components/schemas/Operation"
          "nullable": true
      "required":
        - "session"
        - "operation"
    "Challenge":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "nullable": true
        "qr":
          "type": "string"
          "nullable": true
          "description": "PNG data URL; no-store. Null while generating or after expiry."
        "pairing_code":
          "type": "string"
          "nullable": true
        "auth_method":
          "type": "string"
          "nullable": true
        "expires_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
    "Message":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "session_id":
          "type": "string"
          "format": "uuid"
        "type":
          "type": "string"
          "enum":
            - "text"
            - "image"
            - "document"
            - "voice"
        "transport_status":
          "type": "string"
          "enum":
            - "queued"
            - "processing"
            - "accepted"
            - "failed"
            - "expired"
            - "outcome_unknown"
        "receipt_status":
          "type": "string"
          "enum":
            - "delivered"
            - "read"
            - "played"
          "nullable": true
        "provider_message_id":
          "type": "string"
          "nullable": true
        "error_code":
          "type": "string"
          "nullable": true
        "expires_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
        "created_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
        "updated_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
      "required":
        - "id"
        - "session_id"
        - "transport_status"
    "Media":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "type":
          "type": "string"
          "enum":
            - "image"
            - "document"
            - "voice"
        "filename":
          "type": "string"
        "mimetype":
          "type": "string"
        "size":
          "type": "integer"
          "minimum": 0
        "expires_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
      "required":
        - "id"
        - "type"
        - "filename"
        - "mimetype"
        - "size"
        - "expires_at"
    "Event":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "schema_version":
          "type": "string"
          "enum":
            - "2.0"
        "event":
          "type": "string"
          "enum":
            - "message"
            - "message.ack"
            - "session.status"
        "installation_id":
          "type": "string"
          "format": "uuid"
        "session_id":
          "type": "string"
          "format": "uuid"
        "revision":
          "type": "integer"
          "minimum": 0
        "occurred_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
        "data":
          "type": "object"
          "description": "For session.status: Session snapshot. For message: normalized message_id/chat_id/from/type/text plus optional private media_id/media metadata. For message.ack: hub message_id when correlated, provider_message_id, ack, transport_status, receipt_status."
      "required":
        - "id"
        - "schema_version"
        - "event"
        - "installation_id"
        - "session_id"
        - "revision"
        - "occurred_at"
        - "data"
    "EventPage":
      "type": "object"
      "properties":
        "events":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Event"
        "next_cursor":
          "type": "string"
          "pattern": "^[0-9]+$"
        "has_more":
          "type": "boolean"
      "required":
        - "events"
        - "next_cursor"
        - "has_more"
    "ConnectionCreate":
      "type": "object"
      "properties":
        "type":
          "type": "string"
          "enum":
            - "managed_number"
            - "provider_route"
        "name":
          "type": "string"
          "maxLength": 120
        "is_default":
          "type": "boolean"
        "auth_method":
          "type": "string"
          "enum":
            - "qr"
            - "pairing"
          "default": "qr"
          "description": "managed_number only."
        "phone":
          "type": "string"
          "description": "Required for pairing; international number."
          "pattern": "^\\+?[1-9][0-9]{6,14}$"
        "provider":
          "type": "object"
          "description": "Required for provider_route; prohibited for managed_number."
          "properties":
            "driver":
              "type": "string"
              "enum":
                - "waha"
                - "fonnte"
                - "gowa"
                - "waba"
            "configuration":
              "type": "object"
              "additionalProperties": true
          "required":
            - "driver"
      "required":
        - "type"
    "Connection":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "application":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
        "type":
          "type": "string"
          "enum":
            - "managed_number"
            - "provider_route"
        "status":
          "type": "string"
          "description": "A managed number is ready only while its session is WORKING, freshly observed and idle."
          "enum":
            - "setup_required"
            - "connecting"
            - "ready"
            - "degraded"
            - "disconnected"
            - "error"
        "is_default":
          "type": "boolean"
        "capabilities":
          "type": "array"
          "items":
            "type": "string"
            "enum":
              - "send_text"
              - "send_image"
              - "send_document"
              - "send_video"
              - "send_audio"
              - "number_lookup"
              - "inbound_messages"
              - "delivery_status"
        "sender":
          "type": "object"
          "nullable": true
          "properties":
            "name":
              "type": "string"
            "driver":
              "type": "string"
            "phone":
              "type": "string"
              "nullable": true
        "health":
          "type": "object"
          "additionalProperties": true
        "recommended_action":
          "type": "string"
          "nullable": true
        "session":
          "type": "object"
          "nullable": true
          "description": "managed_number only: the backing v2 session (also visible in /api/v2/sessions)."
          "properties":
            "id":
              "type": "string"
              "format": "uuid"
            "status":
              "type": "string"
              "enum":
                - "STOPPED"
                - "STARTING"
                - "SCAN_QR_CODE"
                - "WORKING"
                - "FAILED"
            "desired_state":
              "type": "string"
            "auth_method":
              "type": "string"
              "nullable": true
            "phone_number":
              "type": "string"
              "nullable": true
            "stale":
              "type": "boolean"
            "engine_available":
              "type": "boolean"
            "last_error":
              "type": "string"
              "nullable": true
            "deleted":
              "type": "boolean"
        "operation":
          "type": "object"
          "nullable": true
          "description": "managed_number only: the pending session command; retryable is always true while pending."
          "properties":
            "id":
              "type": "string"
              "format": "uuid"
            "action":
              "type": "string"
            "status":
              "type": "string"
            "last_error":
              "type": "string"
              "nullable": true
            "retryable":
              "type": "boolean"
        "qr":
          "type": "string"
          "nullable": true
