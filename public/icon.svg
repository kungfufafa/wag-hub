<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <rect width="512" height="512" rx="108" fill="#059669"/>
    <defs>
        <!-- Celah horizontal (slats) agar huruf G Gateway 100% senada/sekeluarga
             dengan Logo H (Oranye) dan Logo DnD (Ungu). -->
        <mask id="slats">
            <rect width="512" height="512" fill="#FFFFFF"/>
            <rect x="60" y="172" width="392" height="14" fill="#000000"/>
            <rect x="60" y="248" width="392" height="14" fill="#000000"/>
            <rect x="60" y="324" width="392" height="14" fill="#000000"/>
        </mask>
    </defs>
    <g fill="#FFFFFF" fill-rule="evenodd" mask="url(#slats)">
        <!-- Palang atas (miring naik ke kanan, senada balok D) -->
        <path d="M 80 112 L 432 88 L 432 150 L 80 150 Z"/>
        <!-- Tiang kiri -->
        <path d="M 80 112 H 136 V 400 H 80 Z"/>
        <!-- Palang bawah (miring, sisi kiri lebih rendah) -->
        <path d="M 80 362 L 432 362 L 432 400 L 80 424 Z"/>
        <!-- Tiang kanan bawah (menutup sisi kanan huruf G) -->
        <path d="M 376 250 H 432 V 400 H 376 Z"/>
        <!-- Lidah tengah huruf G -->
        <path d="M 262 250 H 432 V 306 H 262 Z"/>
    </g>
</svg>
